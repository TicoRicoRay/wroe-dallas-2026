<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>2027 Placeholder — Not Public</title>
  <meta name="description" content="Scaffold for the 2027 event. Not yet public.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B2A4A;
      --navy-dk: #111d33;
      --orange: #F26522;
      --white: #FFFFFF;
      --font-display: 'Montserrat', system-ui, sans-serif;
      --font-body: 'Roboto', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--navy-dk);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .wrap {
      max-width: 560px;
      text-align: center;
    }
    .brand {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
    }
    h1 .accent { color: var(--orange); }
    p {
      color: rgba(255,255,255,0.75);
      font-size: 1.05rem;
      margin: 0 0 2rem;
    }
    a {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--orange);
      text-decoration: none;
      border-bottom: 1px solid rgba(242,101,34,0.35);
      padding-bottom: 2px;
    }
    a:hover { border-bottom-color: var(--orange); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Coming Soon</div>
    <h1>We Run on EOS® <span class="accent">2027</span></h1>
    <p>The 2027 event page is under construction. Details will be published closer to the event.</p>
    <a href="/">&larr; Back to eosnorthtexas.com</a>
  </div>
</body>
</html>
