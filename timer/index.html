<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Timer — WRoEOS North Texas 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1F3A;
    --navy-light: #1A2E4A;
    --orange: #E87722;
    --white: #FFFFFF;
    --muted: #D4DFEA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Roboto', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4vh 2vw;
  }
  .brand {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: clamp(0.75rem, 1.2vw, 1rem);
    letter-spacing: 0.25em;
    color: var(--orange);
    margin-bottom: 1.5vh;
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 3.5vw, 3rem);
    letter-spacing: 0.15em;
    color: var(--orange);
    margin-bottom: 3vh;
    text-transform: uppercase;
  }
  #time {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    /* Sized so H:MM:SS fits on one line without eclipsing the status text below. */
    font-size: clamp(4rem, 16vw, 18rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
    padding: 0 4vw;
    max-width: 100vw;
    white-space: nowrap;
  }
  #time.warning { color: #F5B369; }
  #time.critical { color: #FF6B6B; }
  #time.done { color: var(--orange); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* Sponsor carousel above the timer */
  .sponsors {
    width: 100vw;
    overflow: hidden;
    padding: 1.2vh 0;
    margin-bottom: 3vh;
    /* Fade the edges into the navy background so logos don't hard-cut. */
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
            mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }
  .sponsors-track {
    display: flex;
    align-items: center;
    gap: 2rem;
    /* Two copies of the list are rendered; slide by -50% to loop seamlessly. */
    width: max-content;
    animation: sponsors-scroll 90s linear infinite;
  }
  .sponsors:hover .sponsors-track { animation-play-state: paused; }
  .sponsors-track .logo {
    /* Fixed pill size so every logo occupies the same footprint regardless of
       intrinsic aspect ratio; the <img> inside scales to fit. */
    width: 200px;
    height: 90px;
    background: var(--white);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.75rem;
    flex: 0 0 auto;
  }
  .sponsors-track .logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  @keyframes sponsors-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sponsors-track { animation: none; }
  }
  .controls {
    position: fixed;
    bottom: 3vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
    justify-content: center;
    padding: 0 1rem;
    width: 100%;
    max-width: 1100px;
    opacity: 0.35;
    transition: opacity 0.2s;
  }
  .controls:hover, .controls:focus-within { opacity: 1; }
  .row {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .row-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 0.5rem;
    opacity: 0.7;
  }
  button, .preset {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    background: transparent;
    color: var(--white);
    border: 1.5px solid var(--muted);
    padding: 0.65rem 1.1rem;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  button:hover, .preset:hover {
    background: var(--white);
    color: var(--navy);
    border-color: var(--white);
  }
  button.primary {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--white);
  }
  button.primary:hover {
    background: #B85A15;
    border-color: #B85A15;
    color: var(--white);
  }
  .target {
    border-color: rgba(232, 119, 34, 0.6);
    color: var(--muted);
  }
  .target:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--white);
  }
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: var(--orange);
  }
  @media (max-width: 600px) {
    .controls { gap: 0.4rem; }
    button, .preset { font-size: 0.7rem; padding: 0.5rem 0.7rem; }
  }
</style>
</head>
<body>

<div class="sponsors" aria-hidden="true">
  <div class="sponsors-track" id="sponsorsTrack"></div>
</div>

<div class="brand">WRoEOS NORTH TEXAS 2026</div>
<div class="label" id="label">BREAK TIMER</div>
<div id="time">20:00</div>

<div class="controls">
  <div class="row">
    <span class="row-label">Duration</span>
    <button class="preset" data-minutes="10">10 MIN</button>
    <button class="preset" data-minutes="15">15 MIN</button>
    <button class="preset" data-minutes="20">20 MIN</button>
    <button class="preset" data-minutes="25">25 MIN</button>
  </div>
  <div class="row">
    <span class="row-label">Count Down To</span>
    <button class="target" data-target="08:00">8:00 AM</button>
    <button class="target" data-target="09:55">9:55 AM</button>
    <button class="target" data-target="11:00">11:00 AM</button>
    <button class="target" data-target="13:00">1:00 PM</button>
    <button class="target" data-target="14:50">2:50 PM</button>
    <button class="target" data-target="16:45">4:45 PM</button>
  </div>
  <div class="row">
    <button id="start" class="primary">START</button>
    <button id="reset">RESET</button>
    <button id="fullscreen">FULLSCREEN</button>
  </div>
</div>

<div class="footer"></div>

<audio id="chime" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQBvT19" type="audio/wav">
</audio>

<script>
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');
  const fsBtn = document.getElementById('fullscreen');
  const chime = document.getElementById('chime');

  // ---------- Sponsor carousel ----------
  // Only sponsors with verified: true in config.js are shown on the site's
  // home page — the timer carousel mirrors that list (Trainual is currently
  // unverified and intentionally omitted). Ordered by tier: Title → Book →
  // Happy Hour/Lounge → Swag → Booth. Paths are relative to /timer/.
  const SPONSORS = [
    { name: 'Strety',                    logo: '../images/strety.png' },
    { name: 'The System of Selling',     logo: '../images/tsos.png' },
    { name: 'ProCFO Partners',           logo: '../images/procfopartners.svg' },
    { name: 'Titus Talent',              logo: '../images/titustalent.png' },
    { name: 'Ninety.io',                 logo: '../images/ninety.png' },
    { name: 'Vsimple',                   logo: '../images/vsimple.svg' },
    { name: 'Strata Wealth Advisors',    logo: '../images/strata.jpg' },
    { name: 'Success.co',                logo: '../images/successco.png' },
    { name: '360 Consulting DFW',        logo: '../images/360consultingdfw.png' },
    { name: 'All In One Accounting',     logo: '../images/allinoneaccounting.svg' },
    { name: 'Chief AI Officer',          logo: '../images/chiefaiofficer.webp' },
    { name: 'Hoops HR',                  logo: '../images/hoopshr.webp' },
    { name: 'Next Level Revenue',        logo: '../images/readyforthenextlevel.svg' },
    { name: 'Profit Works',              logo: '../images/profitworks.png' },
    { name: 'Talent Harbor',             logo: '../images/talentharbor.png' },
    { name: "Wolf's Edge Integrators",   logo: '../images/wolfsedgeintegrators.png' },
  ];
  (function populateSponsors() {
    const track = document.getElementById('sponsorsTrack');
    // Each logo lives in a fixed-width pill so every sponsor gets the same
    // slot. Render the list twice back-to-back so the -50% translate loop is
    // seamless.
    const html = SPONSORS.map(s =>
      `<div class="logo"><img src="${s.logo}" alt="${s.name}" loading="lazy"></div>`
    ).join('');
    track.innerHTML = html + html;
  })();

  let durationSec = 20 * 60;
  let remainingSec = durationSec;
  let running = false;
  let intervalId = null;
  let lastTick = null;
  // When counting down to a wall-clock time, we ignore durationSec and
  // recompute remaining from the target on every tick so the timer stays
  // aligned with real time even after pause/resume.
  let targetTs = null; // ms epoch of the target time, or null

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) {
      return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    return m + ':' + String(s).padStart(2, '0');
  }

  function render() {
    timeEl.textContent = fmt(remainingSec);
    timeEl.classList.remove('warning', 'critical', 'done');
    if (remainingSec <= 0) {
      timeEl.classList.add('done');
      timeEl.textContent = "TIME'S UP";
    } else if (remainingSec <= 60) {
      timeEl.classList.add('critical');
    } else if (remainingSec <= 180) {
      timeEl.classList.add('warning');
    }
  }

  function tick() {
    if (targetTs != null) {
      // Wall-clock countdown: recompute from target so drift can't accumulate.
      remainingSec = Math.max(0, (targetTs - Date.now()) / 1000);
    } else {
      const now = performance.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      remainingSec -= dt;
    }
    if (remainingSec <= 0) {
      remainingSec = 0;
      stop();
      playChime();
    }
    render();
  }

  function start() {
    if (running || remainingSec <= 0) return;
    running = true;
    lastTick = performance.now();
    intervalId = setInterval(tick, 250);
    startBtn.textContent = 'PAUSE';
  }

  function stop() {
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    startBtn.textContent = 'START';
  }

  function reset() {
    stop();
    if (targetTs != null) {
      // Re-anchor on the same target so the number reflects real remaining time.
      remainingSec = Math.max(0, (targetTs - Date.now()) / 1000);
    } else {
      remainingSec = durationSec;
    }
    startBtn.textContent = 'START';
    render();
  }

  function setDuration(minutes) {
    stop();
    targetTs = null;
    durationSec = minutes * 60;
    remainingSec = durationSec;
    document.getElementById('label').textContent = 'BREAK TIMER';
    render();
  }

  // hh:mm 24-hour format
  function setTarget(hhmm, displayLabel) {
    stop();
    const [h, m] = hhmm.split(':').map(Number);
    const now = new Date();
    const t = new Date(now);
    t.setHours(h, m, 0, 0);
    // If the target has already passed today, roll forward one day so the
    // timer still counts down (rather than showing TIME'S UP immediately).
    if (t.getTime() <= now.getTime()) t.setDate(t.getDate() + 1);
    targetTs = t.getTime();
    durationSec = Math.max(0, Math.round((targetTs - now.getTime()) / 1000));
    remainingSec = durationSec;
    document.getElementById('label').textContent = 'COUNT DOWN TO ' + displayLabel;
    render();
  }

  function playChime() {
    // Fallback: use the Web Audio API to generate a bell tone in case the
    // inline data-URI audio didn\u2019t play.
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.3);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.3 + 0.05);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.3 + 0.8);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.3);
        osc.stop(ctx.currentTime + i * 0.3 + 0.8);
      });
    } catch (e) { /* silent */ }
  }

  // Preset buttons (fixed duration)
  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      setDuration(parseInt(btn.dataset.minutes, 10));
    });
  });

  // Target buttons (count down to wall-clock time)
  document.querySelectorAll('.target').forEach(btn => {
    btn.addEventListener('click', () => {
      setTarget(btn.dataset.target, btn.textContent.trim());
    });
  });

  startBtn.addEventListener('click', () => running ? stop() : start());
  resetBtn.addEventListener('click', reset);
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      running ? stop() : start();
    } else if (e.key === 'r' || e.key === 'R') {
      reset();
    } else if (e.key === 'f' || e.key === 'F') {
      fsBtn.click();
    }
  });

  render();
</script>
</body>
</html>
